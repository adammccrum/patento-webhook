version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: iriskey-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lao}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iriskey-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: iriskey-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iriskey-network

  # LAO Web Application
  lao-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iriskey-lao-web
    environment:
      # Product Configuration
      PRODUCT_ID: ${PRODUCT_ID:-lao}
      PRODUCT_NAME: ${PRODUCT_NAME:-LAO - AI Learning Operating System}

      # Database
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-lao}

      # Redis
      REDIS_URL: redis://redis:6379

      # Authentication
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      PASSWORD_HASH_ROUNDS: ${PASSWORD_HASH_ROUNDS:-12}

      # Environment
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      # API Configuration
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Optional: OAuth Providers
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - iriskey-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  iriskey-network:
    driver: bridge
