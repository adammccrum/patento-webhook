<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1a237e; }
      .subtitle { font-size: 13px; fill: #666; }
      .brain-title { font-size: 16px; font-weight: bold; }
      .component-title { font-size: 12px; font-weight: 600; }
      .component-desc { font-size: 11px; }
      .arrow-main { stroke-width: 3; stroke: #ff6b00; }
      .arrow-feedback { stroke-width: 2; stroke: #999; stroke-dasharray: 5,5; }
      .no-feedback { stroke-width: 2; stroke: #c62828; fill: none; }
    </style>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6b00"/>
    </marker>
    <marker id="circle-red" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="3" fill="#c62828"/>
    </marker>
  </defs>

  <!-- Main title -->
  <text x="600" y="35" text-anchor="middle" class="title">Dual-Brain Architecture: Separation of Reasoning from Authority</text>>
  <text x="600" y="60" text-anchor="middle" class="subtitle">Information flow is one-directional to prevent compromise propagation between brains</text>>

  <!-- LEFT SIDE: REASONING BRAIN -->
  <g id="reasoning-brain">
    <!-- Container -->
    <rect x="30" y="90" width="460" height="580" rx="8" fill="#e3f2fd" stroke="#1a237e" stroke-width="3" stroke-dasharray="8,4"/>

    <!-- Title -->
    <text x="260" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">REASONING BRAIN</text>>
    <text x="260" y="155" text-anchor="middle" font-size="12" fill="#666">(Answers: "What should I do?")</text>>

    <!-- Key characteristic -->
    <rect x="50" y="170" width="420" height="40" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
    <text x="260" y="195" text-anchor="middle" font-size="11" fill="#1976d2" font-weight="bold">Can Use ANY Reasoning System</text>>
    <text x="260" y="210" text-anchor="middle" font-size="10" fill="#0d47a1">LLM, RL agent, symbolic reasoning, hybrid ensemble</text>>

    <!-- Components -->
    <!-- Component 1 -->
    <rect x="50" y="230" width="420" height="70" rx="4" fill="#c5cae9" stroke="#3f51b5" stroke-width="1.5"/>
    <text x="70" y="255" font-size="12" font-weight="bold" fill="#1a237e">Natural Language Understanding</text>>
    <text x="70" y="273" font-size="11" fill="#333">Inference, reasoning, planning, goal decomposition</text>>
    <text x="70" y="289" font-size="10" fill="#666">Learn patterns; make probabilistic inferences; adapt</text>>

    <!-- Component 2 -->
    <rect x="50" y="320" width="420" height="70" rx="4" fill="#c5cae9" stroke="#3f51b5" stroke-width="1.5"/>
    <text x="70" y="345" font-size="12" font-weight="bold" fill="#1a237e">Tool Integration &amp; Planning</text>>
    <text x="70" y="363" font-size="11" fill="#333">Decide which actions/tools to use; reason about outcomes</text>>
    <text x="70" y="379" font-size="10" fill="#666">Chain-of-thought reasoning; multi-step problem solving</text>>

    <!-- Component 3 -->
    <rect x="50" y="410" width="420" height="70" rx="4" fill="#c5cae9" stroke="#3f51b5" stroke-width="1.5"/>
    <text x="70" y="435" font-size="12" font-weight="bold" fill="#1a237e">Context Understanding</text>>
    <text x="70" y="453" font-size="11" fill="#333">Understand domain context; infer user intent; interpret nuance</text>>
    <text x="70" y="469" font-size="10" fill="#666">Make assumptions; learn from data; adapt reasoning</text>>

    <!-- Component 4 -->
    <rect x="50" y="500" width="420" height="70" rx="4" fill="#c5cae9" stroke="#3f51b5" stroke-width="1.5"/>
    <text x="70" y="525" font-size="12" font-weight="bold" fill="#1a237e">Confidence &amp; Reasoning Chain</text>>
    <text x="70" y="543" font-size="11" fill="#333">Output: Proposed action with confidence level and reasoning path</text>>
    <text x="70" y="559" font-size="10" fill="#666">Do NOT make authorization decisions; that's Authority Brain's job</text>>

    <!-- Limitations box -->
    <rect x="50" y="590" width="420" height="70" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="260" y="610" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">What Reasoning Brain DOES NOT Do:</text>>
    <text x="70" y="630" font-size="10" fill="#c62828">✗ Check if action is authorized  ✗ Verify identity  ✗ Enforce policies</text>>
    <text x="70" y="648" font-size="10" fill="#c62828">✗ Maintain audit logs  ✗ Revoke authority  ✗ Detect anomalies</text>>
  </g>

  <!-- CENTER: ONE-WAY BRIDGE -->
  <g id="bridge">
    <!-- Bridge connector line -->
    <line x1="490" y1="385" x2="710" y2="385" class="arrow-main" marker-end="url(#arrowhead-orange)"/>

    <!-- Label above arrow -->
    <text x="600" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#ff6b00">ONE-WAY BRIDGE</text>>
    <text x="600" y="380" text-anchor="middle" font-size="11" fill="#ff6b00">(Information flows ONE direction only)</text>>

    <!-- Arrow label: Action Proposal -->
    <rect x="515" y="395" width="170" height="25" rx="3" fill="#fff3e0" stroke="#ff6b00" stroke-width="1.5"/>
    <text x="600" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff6b00">Action Proposal + Reasoning</text>>

    <!-- NO FEEDBACK section -->
    <text x="600" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">NO FEEDBACK PATH</text>>

    <!-- Visual indicator of no feedback -->
    <circle cx="600" cy="495" r="40" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="600" y="500" text-anchor="middle" font-size="24" fill="#c62828">✗</text>>

    <text x="600" y="545" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">Authority Brain decisions</text>>
    <text x="600" y="560" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">do NOT feedback to Reasoning Brain</text>>

    <text x="600" y="580" text-anchor="middle" font-size="10" fill="#666">(Prevents compromised Authority from</text>>
    <text x="600" y="595" text-anchor="middle" font-size="10" fill="#666">influencing Reasoning behavior)</text>>
  </g>

  <!-- RIGHT SIDE: AUTHORITY BRAIN -->
  <g id="authority-brain">
    <!-- Container -->
    <rect x="710" y="90" width="460" height="580" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="3" stroke-dasharray="8,4"/>

    <!-- Title -->
    <text x="940" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">AUTHORITY BRAIN</text>>
    <text x="940" y="155" text-anchor="middle" font-size="12" fill="#666">(Answers: "Are you authorized?")</text>>

    <!-- Key characteristic -->
    <rect x="730" y="170" width="420" height="40" rx="4" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
    <text x="940" y="195" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">DETERMINISTIC – Never Uses Machine Learning for Core Authorization</text>>
    <text x="940" y="210" text-anchor="middle" font-size="10" fill="#c62828">Rule-based policy engine; verifiable decisions</text>>

    <!-- Components -->
    <!-- Component 1 -->
    <rect x="730" y="230" width="420" height="70" rx="4" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
    <text x="750" y="255" font-size="12" font-weight="bold" fill="#1a237e">Identity Verification</text>>
    <text x="750" y="273" font-size="11" fill="#333">Cryptographic signature validation; credential checking</text>>
    <text x="750" y="289" font-size="10" fill="#666">Deterministic; repeatable; auditable</text>>

    <!-- Component 2 -->
    <rect x="730" y="320" width="420" height="70" rx="4" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
    <text x="750" y="345" font-size="12" font-weight="bold" fill="#1a237e">Policy Evaluation</text>>
    <text x="750" y="363" font-size="11" fill="#333">Check action/resource scope against authorization policy</text>>
    <text x="750" y="379" font-size="10" fill="#666">Binary rule matching; no probabilistic decisions</text>>

    <!-- Component 3 -->
    <rect x="730" y="410" width="420" height="70" rx="4" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
    <text x="750" y="435" font-size="12" font-weight="bold" fill="#1a237e">Anomaly Detection &amp; Escalation</text>>
    <text x="750" y="453" font-size="11" fill="#333">Behavioral profiling; anomaly scoring (can use ML)</text>>
    <text x="750" y="469" font-size="10" fill="#666">BUT: Decision to revoke/escalate is DETERMINISTIC</text>>

    <!-- Component 4 -->
    <rect x="730" y="500" width="420" height="70" rx="4" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
    <text x="750" y="525" font-size="12" font-weight="bold" fill="#1a237e">Token Generation &amp; Revocation</text>>
    <text x="750" y="543" font-size="11" fill="#333">Create authority tokens; enforce immediate revocation</text>>
    <text x="750" y="559" font-size="10" fill="#666">Timestamps, scopes, conditions all verifiable</text>>

    <!-- Guarantees box -->
    <rect x="730" y="590" width="420" height="70" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="940" y="610" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">What Authority Brain GUARANTEES:</text>>
    <text x="750" y="630" font-size="10" fill="#2e7d32">✓ Binary decisions: APPROVE / REJECT / ESCALATE  ✓ Auditable</text>>
    <text x="750" y="648" font-size="10" fill="#2e7d32">✓ Deterministic  ✓ Tamper-evident  ✓ Non-repudiation</text>>
  </g>

  <!-- COMPARISON TABLE AT BOTTOM -->
  <g id="comparison">
    <text x="600" y="685" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">Defense-in-Depth: Compromising One Brain Does NOT Compromise the Other</text>>
  </g>
</svg>
