roles:
  owner:
    description: "Full system access, implicit all permissions"
    permissions: [] # owner has all permissions implicitly
    is_builtin: true

  administrator:
    description: "Manage users, roles, system configuration"
    permissions:
      - objective:create
      - objective:view
      - objective:update
      - objective:pause
      - objective:resume
      - objective:cancel
      - objective:delete
      - task:create
      - task:view
      - task:update
      - task:retry
      - task:delete
      - agent:view
      - agent:manage
      - authorization:view
      - authorization:approve
      - authorization:deny
      - authorization:revoke
      - audit:view
      - audit:export
      - provider:manage
      - system:admin
      - websocket:connect
      - websocket:events_view
      - websocket:agent_view
      - websocket:authorization_view
      - websocket:audit_view
      - websocket:objective_view
      - websocket:task_view
      - websocket:state_view
      - voice:view
      - voice:create
      - voice:transcribe
      - voice:preview
      - voice:download
      - voice:cancel
      - voice:configure_provider
      - voice:view_sensitive
      - voice:admin
    is_builtin: true

  operator:
    description: "Execute and monitor objectives, approve authorizations"
    permissions:
      - objective:view
      - objective:pause
      - objective:resume
      - objective:cancel
      - task:view
      - task:retry
      - agent:view
      - authorization:view
      - authorization:approve
      - authorization:deny
      - websocket:connect
      - websocket:events_view
      - websocket:agent_view
      - websocket:authorization_view
      - websocket:objective_view
      - websocket:task_view
      - websocket:state_view
      - voice:view
      - voice:create
      - voice:transcribe
      - voice:preview
      - voice:download
      - voice:cancel
    is_builtin: true

  reviewer:
    description: "View-only access to objectives, tasks, and audit logs"
    permissions:
      - objective:view
      - task:view
      - agent:view
      - authorization:view
      - audit:view
      - websocket:connect
      - websocket:events_view
      - websocket:agent_view
      - websocket:objective_view
      - websocket:task_view
      - websocket:state_view
      - voice:view
    is_builtin: true

  viewer:
    description: "Limited view-only access to objectives and tasks"
    permissions:
      - objective:view
      - task:view
      - agent:view
      - websocket:connect
      - websocket:events_view
      - websocket:objective_view
      - websocket:task_view
      - voice:view
    is_builtin: true

  service_agent:
    description: "Machine identity for service agents"
    permissions:
      - task:execute
      - agent:report_status
      - objective:view
      - websocket:connect
      - websocket:events_view
      - websocket:agent_view
      - websocket:task_view
      - voice:create
      - voice:transcribe
    is_builtin: true

permissions:
  # Objective permissions
  - action: objective:create
    resource: objective
    description: "Create new objectives"
  - action: objective:view
    resource: objective
    description: "View objectives"
  - action: objective:update
    resource: objective
    description: "Update objective details"
  - action: objective:pause
    resource: objective
    description: "Pause objective execution"
  - action: objective:resume
    resource: objective
    description: "Resume paused objective"
  - action: objective:cancel
    resource: objective
    description: "Cancel objective"
  - action: objective:delete
    resource: objective
    description: "Delete objective"

  # Task permissions
  - action: task:create
    resource: task
    description: "Create new tasks"
  - action: task:view
    resource: task
    description: "View tasks"
  - action: task:update
    resource: task
    description: "Update task details"
  - action: task:retry
    resource: task
    description: "Retry failed task"
  - action: task:delete
    resource: task
    description: "Delete task"
  - action: task:execute
    resource: task
    description: "Execute task (service agents only)"

  # Agent permissions
  - action: agent:view
    resource: agent
    description: "View agent status and capabilities"
  - action: agent:manage
    resource: agent
    description: "Manage agent configuration"
  - action: agent:report_status
    resource: agent
    description: "Report agent status (service agents only)"

  # Authorization permissions
  - action: authorization:view
    resource: authorization
    description: "View authorization requests"
  - action: authorization:approve
    resource: authorization
    description: "Approve authorization requests"
  - action: authorization:deny
    resource: authorization
    description: "Deny authorization requests"
  - action: authorization:revoke
    resource: authorization
    description: "Revoke previous authorizations"

  # Audit permissions
  - action: audit:view
    resource: audit
    description: "View audit logs"
  - action: audit:export
    resource: audit
    description: "Export audit logs"

  # Provider permissions
  - action: provider:manage
    resource: provider
    description: "Manage external providers"

  # System permissions
  - action: system:admin
    resource: system
    description: "System administration access"

  # WebSocket permissions
  - action: websocket:connect
    resource: websocket
    description: "Establish WebSocket connection"
  - action: websocket:events_view
    resource: websocket
    description: "View general WebSocket events"
  - action: websocket:agent_view
    resource: websocket
    description: "View agent events via WebSocket"
  - action: websocket:authorization_view
    resource: websocket
    description: "View authorization events via WebSocket"
  - action: websocket:audit_view
    resource: websocket
    description: "View audit events via WebSocket"
  - action: websocket:objective_view
    resource: websocket
    description: "View objective events via WebSocket"
  - action: websocket:task_view
    resource: websocket
    description: "View task events via WebSocket"
  - action: websocket:state_view
    resource: websocket
    description: "View state snapshots via WebSocket"

  # Voice & Audio permissions
  - action: voice:view
    resource: voice
    description: "View voice providers and capabilities"
  - action: voice:create
    resource: voice
    description: "Create text-to-speech jobs"
  - action: voice:transcribe
    resource: voice
    description: "Create speech-to-text jobs"
  - action: voice:preview
    resource: voice
    description: "Preview synthetic voices"
  - action: voice:download
    resource: voice
    description: "Download generated audio files"
  - action: voice:cancel
    resource: voice
    description: "Cancel in-progress voice jobs"
  - action: voice:configure_provider
    resource: voice
    description: "Configure voice providers (admin only)"
  - action: voice:view_sensitive
    resource: voice
    description: "View sensitive audio operations (admin only)"
  - action: voice:admin
    resource: voice
    description: "Full voice administration"
