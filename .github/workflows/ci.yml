name: CI

on:
  push:
    branches:
      - main
      - claude/lao-master-build-directive-ih1mi8
  pull_request:
    branches:
      - main
      - claude/lao-master-build-directive-ih1mi8

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lao
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check for dangerous code
        run: |
          if grep -r "TODO\|FIXME\|XXX\|HACK\|PLACEHOLDER" --include="*.ts" --include="*.tsx" apps/ packages/; then
            echo "❌ Found TODO/FIXME comments - not allowed in production code"
            exit 1
          fi
          echo "✓ No TODO/FIXME comments found"

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Test
        run: pnpm test --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lao
          NEXTAUTH_SECRET: test-secret-key
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
